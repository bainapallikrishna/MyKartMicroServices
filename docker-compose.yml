services:
  productservicedb:
    container_name: ProductServiceDB
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "18002:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=seSSion@12
    networks:
      - microservicesnetwork
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "seSSion@12", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  purchaseservicedb:
    container_name: PurchaseServiceDB
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "17002:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=seSSion@12
    networks:
      - microservicesnetwork
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "seSSion@12", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  categoryservicedb:
    container_name: CategoryServiceDB
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "16002:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=seSSion@12
    networks:
      - microservicesnetwork
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "seSSion@12", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  userservicedb:
    container_name: UserServiceDB
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "15002:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=seSSion@12
    networks:
      - microservicesnetwork
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "seSSion@12", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  categorymicroservices:
    container_name: categorymicroservices
    build:
      context: .
      dockerfile: CategoryMicroservices/Dockerfile
    ports:
      - "16001:8080"
    depends_on:
      categoryservicedb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - microservicesnetwork

  productmicroservices:
    container_name: productmicroservices
    build:
      context: .
      dockerfile: ProductMicroservices/Dockerfile
    ports:
      - "18001:8080"
    depends_on:
      productservicedb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - microservicesnetwork

  usermicroservices:
    container_name: usermicroservices
    build:
      context: .
      dockerfile: UserMicroservices/Dockerfile
    ports:
      - "15001:8080"
    depends_on:
      userservicedb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - microservicesnetwork

  purchasemicroservices:
    container_name: purchasemicroservices
    build:
      context: .
      dockerfile: PurchaseMicroservices/Dockerfile
    ports:
      - "17001:8080"
    depends_on:
      purchaseservicedb:
        condition: service_healthy
      productmicroservices:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - microservicesnetwork

  apigateway:
    container_name: apigateway
    build:
      context: .
      dockerfile: MyCartAPIGateWay/Dockerfile
    ports:
      - "19000:8080"
    depends_on:
      categorymicroservices:
        condition: service_started
      productmicroservices:
        condition: service_started
      usermicroservices:
        condition: service_started
      purchasemicroservices:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - microservicesnetwork

networks:
  microservicesnetwork: